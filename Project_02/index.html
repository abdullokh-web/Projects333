<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Pexels SPA Downloader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- App CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand">
        <div class="container">
            <span class="navbar-brand text-white fw-semibold">
                PEXELS SPA
            </span>
            <div>
                <span class="nav-link d-inline me-3 active" onclick="navigate('photos', this)">
                    Photos
                </span>
                <span class="nav-link d-inline" onclick="navigate('videos', this)">
                    Videos
                </span>
            </div>
        </div>
    </nav>

    <!-- ================= APP ================= -->
    <main class="container py-4">

        <!-- SEARCH -->
        <div class="input-group mb-4">
            <input id="query" class="form-control" placeholder="Search images or videos..." autocomplete="off" />
            <button class="btn btn-primary" onclick="startSearch()">
                Search
            </button>
        </div>

        <!-- RESULTS -->
        <div id="view" class="row g-3"></div>

        <!-- LOADER -->
        <div id="loader" class="text-center my-4 d-none">
            <div class="spinner-border" role="status" aria-label="Loading"></div>
        </div>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="site-footer text-center" role="contentinfo" aria-label="Footer">
        <div class="container">
            <small>
                Crafted with ❤️ by
                <a href="https://t.me/AbdullokhBlog" target="_blank" rel="noopener noreferrer" class="author-link">
                    Abdullokh
                </a>
            </small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App JS (SPA logic) -->
    <script src="assets/js/app.js" defer></script>

</body>

</html>
